aid: qognitive
name: Qognitive
description: >-
  Qognitive, Inc. is an AI company that develops QCML (Quantum Cognition Machine
  Learning), an analytical AI architecture positioned as an alternative to
  classical statistical modeling. Its product, Hone, targets high-dimensional,
  multi-modal, and noisy structured data — claiming near-linear scaling with
  feature count and accuracy improvements over industry-standard models, with
  peer-reviewed backing in Nature Scientific Reports and Risk.net. Hone is
  distributed as first-party Python packages (hone-io community edition and
  hone-io-enterprise) exposing scikit-learn-compatible regression and
  classification wrappers. The company was surfaced as a Ribbit Capital
  portfolio company. There is no public REST/HTTP API surface; integration is
  via the Python SDK.
